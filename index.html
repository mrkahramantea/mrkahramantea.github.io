<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0d10">
  <title>KOD: KURGU ATOLYESI // Interaktif Oyun Arsivi</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: #0b0d10;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Tema Varyasyonlari */
    body.theme-paper {
      background-color: #f4ecd8;
      color: #262220;
      font-family: Georgia, serif;
    }
    body.theme-amber {
      background-color: #120e07;
      color: #ffb000;
    }

    .portal-container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 18px 60px 18px;
    }

    /* Ust Baslik ve Kontroller */
    .portal-header {
      border-bottom: 2px solid rgba(128, 128, 128, 0.3);
      padding-bottom: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin: 0 0 6px 0;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 12px;
      opacity: 0.75;
      margin: 0;
    }
    .studio-btn {
      background: rgba(128, 128, 128, 0.12);
      border: 1px solid rgba(128, 128, 128, 0.45);
      color: inherit;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .studio-btn:active {
      background: rgba(128, 128, 128, 0.35);
    }

    /* Arama ve Kategori Filtreleri */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-input {
      width: 100%;
      background: rgba(128, 128, 128, 0.08);
      border: 1px solid rgba(128, 128, 128, 0.35);
      color: inherit;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .category-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      background: transparent;
      border: 1px solid rgba(128, 128, 128, 0.35);
      color: inherit;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      opacity: 0.7;
    }
    .cat-btn.active {
      opacity: 1;
      background: rgba(128, 128, 128, 0.25);
      font-weight: bold;
      border-color: currentColor;
    }

    /* Tipografik Dosya Kartlari */
    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .game-card {
      background: rgba(128, 128, 128, 0.06);
      border: 1px solid rgba(128, 128, 128, 0.28);
      border-left-width: 5px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.8px;
      opacity: 0.85;
    }
    .save-badge {
      padding: 2px 7px;
      border: 1px solid currentColor;
      font-size: 10px;
      font-weight: bold;
    }
    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .card-desc {
      font-size: 13.5px;
      line-height: 1.6;
      margin: 0;
      opacity: 0.88;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11px;
      opacity: 0.75;
      padding-top: 8px;
      border-top: 1px dashed rgba(128, 128, 128, 0.25);
    }
    .card-action {
      margin-top: 6px;
      display: flex;
      justify-content: flex-end;
    }
    .play-link {
      display: inline-block;
      background: rgba(128, 128, 128, 0.18);
      border: 1px solid currentColor;
      color: inherit;
      text-decoration: none;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.8px;
    }

    /* Tur Renk Kodlari */
    .tur-polisiye { border-left-color: #e11d48; }
    .tur-bilimkurgu { border-left-color: #06b6d4; }
    .tur-strateji { border-left-color: #f59e0b; }
    .tur-macera { border-left-color: #10b981; }

    .portal-footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
      font-size: 11px;
      text-align: center;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="portal-header">
      <div>
        <h1 class="brand-title">KOD: KURGU ATOLYESI</h1>
        <p class="brand-sub">BAGIMSIZ INTERAKTIF METIN OYUNLARI ARSIVI</p>
      </div>
      <div>
        <button class="studio-btn" onclick="togglePortalTheme()" id="theme-btn">TEMA: GECE</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="game-search" class="search-input" placeholder="Dosya adi veya konu ara..." oninput="renderGames()">
      <div class="category-list">
        <button class="cat-btn active" onclick="setCategory('TUMU', this)">TUM DOSYALAR</button>
        <button class="cat-btn" onclick="setCategory('POLISIYE', this)">POLISIYE / GERILIM</button>
        <button class="cat-btn" onclick="setCategory('BILIM KURGU', this)">BILIM KURGU</button>
        <button class="cat-btn" onclick="setCategory('STRATEJI', this)">TARIH / STRATEJI</button>
        <button class="cat-btn" onclick="setCategory('MACERA', this)">MACERA</button>
      </div>
    </div>

    <div class="games-grid" id="games-list"></div>
    <div class="portal-footer" id="portal-stats"></div>
  </div>

  <script>
    /* =========================================================
       YENI OYUN EKLEME ALANI
       Not: link kismina sadece olusturdugun dosya adini yaz.
       ========================================================= */
    var OYUN_ARSIVI = [
      {
        id: "01",
        baslik: "SESSIZ ISTASYON",
        kategori: "BILIM KURGU",
        renkSinifi: "tur-bilimkurgu",
        sure: "15-20 DK",
        zorluk: "ORTA",
        sonSayisi: "4 FARKLI SON",
        ozet: "Kuzey Kutup arastirma istasyonunda jenerator arizalanir. Yedek terminalde sadece tek bir sisteme guc verecek kadar enerji kalmistir.",
        link: "sessiz-istasyon.html"
      },
      {
        id: "02",
        baslik: "SON SORGU: DOSYA 84",
        kategori: "POLISIYE",
        renkSinifi: "tur-polisiye",
        sure: "25 DK",
        zorluk: "ZOR",
        sonSayisi: "3 FARKLI SON",
        ozet: "Firtinali bir gecede karakola gelen gizemli tanik, islenmemis bir sucu itiraf eder. Celiskileri yakalamak icin sadece 10 soruluk zamanin var.",
        link: "son-sorgu.html"
      }
    ];

    var activeCategory = "TUMU";
    var portalThemes = ["", "theme-paper", "theme-amber"];
    var portalThemeNames = ["GECE", "KAGIT", "KEHRIBAR"];
    var currentThemeIndex = parseInt(localStorage.getItem("STUDIO_THEME_IDX") || "0", 10);

    function applyPortalTheme() {
      document.body.className = portalThemes[currentThemeIndex];
      document.getElementById("theme-btn").innerText = "TEMA: " + portalThemeNames[currentThemeIndex];
    }

    function togglePortalTheme() {
      currentThemeIndex = (currentThemeIndex + 1) % portalThemes.length;
      localStorage.setItem("STUDIO_THEME_IDX", currentThemeIndex.toString());
      applyPortalTheme();
    }

    function setCategory(cat, btnElement) {
      activeCategory = cat;
      var btns = document.querySelectorAll(".cat-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].className = "cat-btn";
      }
      btnElement.className = "cat-btn active";
      renderGames();
    }

    function renderGames() {
      var searchVal = document.getElementById("game-search").value.toLowerCase();
      var container = document.getElementById("games-list");
      container.innerHTML = "";
      var visibleCount = 0;

      for (var i = 0; i < OYUN_ARSIVI.length; i++) {
        var g = OYUN_ARSIVI[i];
        var matchCat = (activeCategory === "TUMU" || g.kategori === activeCategory);
        var matchSearch = (g.baslik.toLowerCase().indexOf(searchVal) !== -1 || g.ozet.toLowerCase().indexOf(searchVal) !== -1);

        if (matchCat && matchSearch) {
          visibleCount++;
          var hasSave = localStorage.getItem("OYUN_KAYIT_" + g.id) !== null;
          var badgeText = hasSave ? "[KAYIT MEVCUT]" : "[YENI DOSYA]";
          var btnText = hasSave ? "KAYITTAN DEVAM ET [->]" : "DOSYAYI AC [->]";

          var cardHTML = '<div class="game-card ' + g.renkSinifi + '">' +
            '<div class="card-top">' +
              '<span>DOSYA #' + g.id + ' // ' + g.kategori + '</span>' +
              '<span class="save-badge">' + badgeText + '</span>' +
            '</div>' +
            '<h2 class="card-title">' + g.baslik + '</h2>' +
            '<p class="card-desc">' + g.ozet + '</p>' +
            '<div class="card-meta">' +
              '<span>SURE: ' + g.sure + '</span>' +
              '<span>|</span>' +
              '<span>ZORLUK: ' + g.zorluk + '</span>' +
              '<span>|</span>' +
              '<span>SON: ' + g.sonSayisi + '</span>' +
            '</div>' +
            '<div class="card-action">' +
              '<a href="' + g.link + '" class="play-link">' + btnText + '</a>' +
            '</div>' +
          '</div>';

          container.innerHTML += cardHTML;
        }
      }

      if (visibleCount === 0) {
        container.innerHTML = '<p style="opacity:0.7;text-align:center;padding:30px 0;">Aranan kriterlere uygun dosya bulunamadi.</p>';
      }

      document.getElementById("portal-stats").innerText = "SISTEMDE TOPLAM " + OYUN_ARSIVI.length + " AKTIF INTERAKTIF DOSYA BULUNMAKTADIR.";
    }

    applyPortalTheme();
    renderGames();
  </script>
</body>
</html>
